[project]
name = "market_brief"
version = "0.1.0"
description = "A CLI application for collecting market news and generating personalized briefings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "tzdata>=2026.3 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
